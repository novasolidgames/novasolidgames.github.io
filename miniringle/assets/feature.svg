  <rect width="1024" height="500" fill="url(#bg)"/>

  <g fill="#3a2f28" opacity="0.12">
    <ellipse cx="224" cy="256" rx="58" ry="10"/>
    <ellipse cx="416" cy="256" rx="58" ry="10"/>
    <ellipse cx="608" cy="256" rx="58" ry="10"/>
    <ellipse cx="800" cy="256" rx="58" ry="10"/>
  </g>
  <use href="#smile" xlink:href="#smile" x="224" y="156"/>
  <use href="#wink" xlink:href="#wink" x="416" y="170"/>
  <use href="#wow" xlink:href="#wow" x="608" y="152"/>
  <use href="#joy" xlink:href="#joy" x="800" y="166"/>

  <text x="512" y="372" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="92" font-weight="900" letter-spacing="2" fill="#3a2f28">MiniRingle</text>
  <text x="512" y="438" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="36" font-weight="700" letter-spacing="10" fill="#8a6f55">4P MINIGAME</text>
